name: AMIS independent checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  domain-and-thin-jar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Extract fixed formal host without starting a container
        run: bash scripts/prepare-host.sh
      - name: Verify platform POM and module checksums remain pinned
        run: python3 scripts/test-dependency-metadata.py
      - name: Run domain, runtime, UI unit, translation and thin jar gates
        run: bash scripts/gradle.sh clean check
      - name: Check runtime asset integrity rejection cases
        run: |
          python3 scripts/test-runtime-assets.py
          python3 scripts/test-package-release.py
          python3 scripts/test-restore-ci-artifact.py
      - name: Install pinned Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Run the complete independent runtime and preference browser matrices
        working-directory: ui
        run: |
          npm run test:chromium
          npm run test:preferences:red
          node scripts/check-report.mjs
      - name: Run the additional P1 real controls matrix
        working-directory: ui
        run: npm run test:p1
      - name: Run P1 production login and actual Flow executions with one isolated PostgreSQL
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, writeFileSync} from 'node:fs';
          import {resolve} from 'node:path';
          import {createHash} from 'node:crypto';
          const jar = resolve('build/libs/kestra-plugin-amis-apps-0.0.1-SNAPSHOT.jar');
          writeFileSync('.work/p1-ci-options.json', JSON.stringify({schemaVersion: 1,
            startIsolatedStack: true, directory: resolve('.work/p1-ci-production'),
            port: 18671, jar, jarSha256: createHash('sha256').update(readFileSync(jar)).digest('hex')}), {mode: 0o600});
          JS
          node scripts/run-p1-production.mjs .work/p1-ci-options.json
      - name: Verify P2 fixed examples and report rejection tests without infrastructure
        run: node --test scripts/test-p2-*.mjs
      - name: Run P2 independent multi-page multi-API transport matrix
        working-directory: ui
        run: npm run test:p2
      - name: Run P2 production executions after P1 cleanup with one isolated PostgreSQL
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {resolve} from 'node:path';
          import {createHash} from 'node:crypto';
          const jar=resolve('build/libs/kestra-plugin-amis-apps-0.0.1-SNAPSHOT.jar');
          writeFileSync('.work/p2-ci-options.json',JSON.stringify({schemaVersion:1,startIsolatedStack:true,
            directory:resolve('.work/p2-ci-production'),port:18672,jar,
            jarSha256:createHash('sha256').update(readFileSync(jar)).digest('hex')}),{mode:0o600});
          JS
          node scripts/run-p2-production.mjs .work/p2-ci-options.json
      - name: Verify pinned Gradle launcher ignores unrelated runner defaults
        run: python3 scripts/test-gradle-launcher.py
      - name: Verify inherited image labels cannot claim the overlay source commit
        run: |
          mkdir -p .work/host-evidence-tests
          python3 scripts/test-host-evidence.py > .work/host-evidence-tests/results.log 2>&1
      - name: Prove build gates reject invalid inputs
        run: python3 scripts/test-build-gates.py
      - name: Recheck restored inputs and artifact
        run: bash scripts/gradle.sh check
      - name: Upload foundation evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amis-foundation-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            build/libs/*.jar
            build/reports/
            build/test-results/
            .integration/host-provenance.json
            ui/reports/
            ui/test-results/
            ui/test-results-preferences-red/
            ui/test-results-p1/
            ui/test-results-p2/
            examples/p1/
            examples/p2/
            contracts/p1-cases.json
            contracts/p2-cases.json
            .integration/host-public-types.txt
            .integration/host-flow-validation.txt
            .work/gate-tests/
            .work/host-evidence-tests/
